{% extends "website/components/layout/dashboard.html" %}
{% load static icon %}
{% block title %}Strain | Cannlytics{% endblock %}
{% block dashboard %}

<!-- Breadcrumbs -->
<section class="container mb-3">
  <div class="d-flex mt-4">
    <nav
      style="--bs-breadcrumb-divider: '>';"
      aria-label="breadcrumb"
    >
      <ol class="breadcrumb bg-transparent p-0 mb-0">
        <li class="breadcrumb-item fs-6 lh-sm">
          <a
            class="text-dark serif action"
            href="{% url 'page' page='strains' %}"
          >
            Strains
          </a>
        </li>
        <li class="breadcrumb-item fs-6 lh-sm">
          Strain
        </li>
      </ol>
      <div>
    </div>
    </nav>
  </div>
</section>

<!-- Strain -->
<section class="container markdown">
  <div class="row">
    <div class="col-md-6">
      <img id="strainImageUrl" class="img-fluid" alt="Strain Image">
    </div>
    <div class="col-md-6">
      <h1 id="strainName"></h1>
      <p id="strainDescription"></p>
      <p>Total Favorites: <span id="strainTotalFavorites"></span></p>
      <!-- TODO: Add other strain fields -->
    </div>
  </div>

  <!-- TODO: Add sections for strain analytics, lab results, etc. -->

  <!-- TODO: Add additional sections:
    - Ridge plots for cultivars with terpene data.
    - Regression plots of ratios with all strains colored by strain.
    - Review strain.
      * On a scale of 1 - 10:
      * Legs
      * Nose
  -->
</section>
{% endblock %}
</html>
