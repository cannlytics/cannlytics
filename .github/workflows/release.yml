# Release | Cannlytics
#
# Publishes a release when a `v*` tag is pushed, with PyPI's Trusted
# Publishing (no API tokens). See RELEASING.md, "Later: releases from a tag".
# Test on both platforms and every supported Python, build once, check the
# tag against `__version__`, upload to TestPyPI, then to PyPI (the `pypi`
# environment can require your approval). Update the action versions if
# GitHub flags them as deprecated.
name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[test]"
      - run: python -m pytest tests -q

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: The tag matches the package version
        run: |
          python - <<'PY'
          import os, re, sys
          version = re.search(r"__version__ = '([^']+)'", open('cannlytics/__init__.py').read()).group(1)
          tag = os.environ['GITHUB_REF_NAME']
          sys.exit(0 if tag == f'v{version}' else f'Tag {tag} does not match version {version}.')
          PY
      - run: python -m pip install build twine
      - run: python -m build
      - run: python -m twine check --strict dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  testpypi:
    needs: build
    runs-on: ubuntu-latest
    environment: testpypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  pypi:
    needs: testpypi
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
